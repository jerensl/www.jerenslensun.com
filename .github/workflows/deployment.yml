name: Docs Deployment

# Deploy Storybook bi-weekly At 05:00 on Monday and Thursday.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1,4"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build_docs:
    name: Build and Push Storybook Docs
    if: github.repository == 'jerensl/www.jerenslensun.com'
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2.14.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.1
        with:
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@v6.2.0
        with:
          node-version-file: ".nvmrc"
      - name: Deploy Storybook Docs
        uses: bitovi/github-actions-storybook-to-github-pages@b75ece8f984a32b2adb322065d7a8a2cc8db2d52 # v1.0.3
        with:
          install_command: pnpm install # default: npm ci
          build_command: pnpm --filter='./apps/web-app' run build:storybook # default: npm run build-storybook
          path: storybook-static # default: dist/storybook
          checkout: false # default: true
