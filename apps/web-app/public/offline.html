<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — Jerens Lensun</title>
    <style>
        body { font-family: system-ui, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background: #FFF8F7; color: #271816; }
        .container { text-align: center; padding: 2rem; }
        h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
        p { color: #58413E; margin-bottom: 1.5rem; }
        button { padding: 0.5rem 1.5rem; border: 1px solid #C0000A; background: #C0000A; color: #fff; border-radius: 9999px; cursor: pointer; font-size: 1rem; }
        button:hover { opacity: 0.9; }
    </style>
</head>
<body>
    <div class="container">
        <h1>You're offline</h1>
        <p>This page hasn't been cached yet. Check your connection and try again.</p>
        <button onclick="window.location.reload()">Retry</button>
    </div>
    <script>
        window.addEventListener('online', () => window.location.reload());
    </script>
</body>
</html>
